<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nothing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; color: #e0e0e0; text-align: center;
            padding: 20px; transition: background-color 1s ease;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
            user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
        }

        .content-wrapper {
            width: 100%; max-width: 900px; display: flex; flex-direction: column;
            align-items: center; padding: 20px 0; overflow-y: auto; max-height: 100dvh;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw + 1rem, 5rem); font-weight: 300;
            max-width: 90%; line-height: 1.4; letter-spacing: 0.02em;
            word-wrap: break-word;
        }

        .word {
            cursor: pointer; display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s, background-color 0.2s;
            padding: 0 0.1em; border-radius: 6px; -webkit-tap-highlight-color: transparent; 
        }

        .word:hover { color: #fff; }

        .word.selected {
            background-color: rgba(255, 255, 255, 0.15); color: #fff;
            transform: scale(1.15); box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .word.swapping { animation: swapBounce 0.3s ease; }
        .word.cloning { animation: cloneFlash 0.4s ease; }

        @keyframes swapBounce {
            0% { transform: scale(1.15); } 50% { transform: scale(0.85); } 100% { transform: scale(1); }
        }

        @keyframes cloneFlash {
            0% { transform: scale(1); background-color: rgba(255, 255, 0, 0.5); }
            50% { transform: scale(1.3); background-color: rgba(255, 255, 0, 0.8); }
            100% { transform: scale(1); background-color: transparent; }
        }

        /* OPTIMIZED RED TEXT STYLES */
        .ominous-container {
            display: inline-block;
            white-space: nowrap; /* Forces it to stretch right only */
            vertical-align: baseline;
        }

        .ominous-text {
            color: #ff0000 !important; /* Force red */
            font-style: italic;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.3);
            animation: ominousPulse 2s ease-in-out infinite;
            display: inline;
        }

        @keyframes ominousPulse {
            0%, 100% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.3); }
            50% { text-shadow: 0 0 25px rgba(255, 0, 0, 0.9), 0 0 50px rgba(255, 0, 0, 0.5); }
        }

        .hint {
            margin-top: 30px; font-size: 0.9rem; color: #555; font-weight: 300;
            letter-spacing: 0.1em; text-transform: uppercase; opacity: 0;
            animation: fadeIn 2s ease forwards 1s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 600px) { body { background-color: #1a101c; } h1 { font-weight: 400; } .hint { font-size: 0.75rem; } }
        @media (min-width: 1600px) { body { background-color: #0a0f14; } }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h1 id="sentence"></h1>
        <div class="hint">Tap a word. Then tap another.</div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSelectSound() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSwapSound() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playTypeSound() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200 + Math.random() * 600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        function playAngryTypeSound() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300 + Math.random() * 200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playCloneSound() {
            initAudio();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.type = 'sine'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
            osc2.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 0.2);
            osc2.stop(audioCtx.currentTime + 0.2);
        }

        function playOminousSound() {
            initAudio();
            const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
            osc1.connect(gain1); gain1.connect(audioCtx.destination); osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(55, audioCtx.currentTime);
            osc1.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 3);
            gain1.gain.setValueAtTime(0, audioCtx.currentTime);
            gain1.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);
            gain1.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3);
            osc1.start(); osc1.stop(audioCtx.currentTime + 3);

            const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.type = 'sine';
            osc2.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc2.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 2);
            gain2.gain.setValueAtTime(0, audioCtx.currentTime);
            gain2.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.8);
            gain2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5);
            osc2.start(); osc2.stop(audioCtx.currentTime + 2.5);
        }

        function playOminousTypeSound() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine';
            osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        const originalSentence = "There is nothing to do here. Go do something else.";
        const targetSentence = "There is something to do here. Go do nothing else."; 
        const sentenceEl = document.getElementById('sentence');
        let selectedWord = null;
        let triggered = false;
        let triggered2 = false;
        let triggeredOminous = false;

        function createWords(text, container) {
            const words = text.split(' ');
            words.forEach(word => {
                if (word.includes('+')) {
                    const parts = word.split('+');
                    parts.forEach((part, index) => {
                        if (part) {
                            const span = document.createElement('span');
                            span.className = 'word'; span.textContent = part; span.style.color = '#ffffff';
                            container.appendChild(span); container.appendChild(document.createTextNode(' '));
                        }
                        if (index < parts.length - 1) {
                            const plusSpan = document.createElement('span');
                            plusSpan.className = 'word'; plusSpan.textContent = '+'; plusSpan.style.color = '#ffffff';
                            container.appendChild(plusSpan); container.appendChild(document.createTextNode(' '));
                        }
                    });
                } else {
                    const span = document.createElement('span');
                    span.className = 'word'; span.textContent = word; span.style.color = '#ffffff';
                    container.appendChild(span); container.appendChild(document.createTextNode(' ')); 
                }
            });
        }

        createWords(originalSentence, sentenceEl);

        function checkSentence() {
            const allWords = document.querySelectorAll('#sentence .word');
            let currentSentence = '';
            for (let i = 0; i < Math.min(10, allWords.length); i++) {
                currentSentence += allWords[i].textContent;
                if (i < 9) currentSentence += ' ';
            }
            if (currentSentence === targetSentence && !triggered) {
                triggered = true;
                setTimeout(triggerAnger1, 400);
            }
        }

        function checkForGrammarTrap() {
            if (!triggered || triggered2) return;
            const allWords = Array.from(document.querySelectorAll('#sentence .word'));
            const firstMessageWords = allWords.slice(10);
            if (firstMessageWords.length < 17) return;
            
            const pos7 = firstMessageWords[7].textContent;
            const pos8 = firstMessageWords[8].textContent;
            const pos15 = firstMessageWords[15].textContent;
            const pos16 = firstMessageWords[16].textContent;
            
            if (pos7 === 'an' && pos8 === 'idiot' && pos15 === 'a' && pos16 === 'smart') {
                triggered2 = true;
                setTimeout(triggerAnger2, 400);
            }
        }

        // FIXED: Checks ONLY if "way." has nothing to its right
        function checkForOminousTrap() {
            if (triggeredOminous) return;
            const allWords = Array.from(document.querySelectorAll('#sentence .word'));
            if (allWords.length < 4) return;
            
            // Find the LAST occurrence of "way." or "way"
            let wayIndex = -1;
            for (let i = allWords.length - 1; i >= 0; i--) {
                if (allWords[i].textContent === 'way.' || allWords[i].textContent === 'way') {
                    wayIndex = i;
                    break;
                }
            }
            
            if (wayIndex === -1) return;
            
            // Check if it's the absolute last word
            if (wayIndex !== allWords.length - 1) return;
            
            // Check if the 3 words before it are "I", "know", "a"
            if (wayIndex >= 3) {
                const w1 = allWords[wayIndex - 3].textContent;
                const w2 = allWords[wayIndex - 2].textContent;
                const w3 = allWords[wayIndex - 1].textContent;
                
                if (w1 === 'I' && w2 === 'know' && w3 === 'a') {
                    triggeredOminous = true;
                    triggerOminousVisual(allWords[wayIndex]); // Pass the "way" element to attach next to it
                    setTimeout(playOminousSound, 100);
                }
            }
        }

        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('word')) return;
            e.preventDefault();
            const wordEl = e.target;

            initAudio();

            if (!selectedWord) {
                selectedWord = wordEl;
                wordEl.classList.add('selected');
                playSelectSound();
            } else if (selectedWord === wordEl) {
                wordEl.classList.remove('selected');
                selectedWord = null;
            } else {
                const word1 = selectedWord.textContent;
                const word2 = wordEl.textContent;

                if (word1 === '+' || word2 === '+') {
                    const plusElement = word1 === '+' ? selectedWord : wordEl;
                    const wordToClone = word1 === '+' ? wordEl : selectedWord;
                    const wordText = wordToClone.textContent;

                    plusElement.remove();
                    const duplicate = document.createElement('span');
                    duplicate.className = 'word'; duplicate.textContent = wordText; duplicate.style.color = '#ffffff';
                    wordToClone.parentNode.insertBefore(duplicate, wordToClone.nextSibling);
                    wordToClone.parentNode.insertBefore(document.createTextNode(' '), duplicate.nextSibling);

                    playCloneSound();
                    wordToClone.classList.add('cloning'); duplicate.classList.add('cloning');
                    
                    setTimeout(() => {
                        wordToClone.classList.remove('cloning'); duplicate.classList.remove('cloning');
                        selectedWord.classList.remove('selected'); selectedWord = null;
                    }, 400);
                    return;
                }

                selectedWord.textContent = word2;
                wordEl.textContent = word1;

                wordEl.classList.add('swapping'); selectedWord.classList.add('swapping');
                playSwapSound();
                
                if (!triggered) checkSentence();
                else checkForGrammarTrap();
                checkForOminousTrap();

                setTimeout(() => {
                    wordEl.classList.remove('swapping'); selectedWord.classList.remove('swapping');
                    selectedWord.classList.remove('selected'); selectedWord = null;
                }, 300);
            }
        });

        function triggerAnger1() {
            sentenceEl.appendChild(document.createElement('br'));
            const tempSpan = document.createElement('span'); tempSpan.style.color = '#ffffff';
            sentenceEl.appendChild(tempSpan);
            const text = "You think you are funny? Well I'm a smart person. And I think you are an idiot for even trying. Give up.";
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) { tempSpan.textContent += text[i]; playTypeSound(); i++; } 
                else { clearInterval(interval); tempSpan.remove(); createWords(text, sentenceEl); }
            }, 40);
        }

        function triggerAnger2() {
            sentenceEl.appendChild(document.createElement('br'));
            const tempSpan = document.createElement('span'); tempSpan.style.color = '#ffffff';
            sentenceEl.appendChild(tempSpan);
            const text = "Stop messing around! Do you even know 1+1? I am better than you in every way. You are not smart at all and you need to get out of here! Not I as I am really smart. Get out of here you dumb idiot!";
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) { tempSpan.textContent += text[i]; playAngryTypeSound(); i++; } 
                else { clearInterval(interval); tempSpan.remove(); createWords(text, sentenceEl); }
            }, 25); 
        }

        // OPTIMIZED: Uses a single text node for typing, converts to spans only at the end
        function triggerOminousVisual(wayElement) {
            document.body.style.backgroundColor = '#1a0000';
            
            // Create container that stays inline with "way."
            const container = document.createElement('span');
            container.className = 'ominous-container';
            
            // Insert AFTER the "way." element
            wayElement.parentNode.insertBefore(container, wayElement.nextSibling);
            
            // Use a simple text node for performance during typing
            const textNode = document.createTextNode('');
            container.appendChild(textNode);

            const text = "Oh I know a way indeed. A way to death perhaps?";
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) {
                    textNode.textContent += text[i];
                    playOminousTypeSound();
                    i++;
                } else {
                    clearInterval(interval);
                    // Convert to clickable spans ONLY after typing is done
                    container.innerHTML = '';
                    const words = text.split(' ');
                    words.forEach(word => {
                        const span = document.createElement('span');
                        span.className = 'word ominous'; span.textContent = word;
                        container.appendChild(span); container.appendChild(document.createTextNode(' '));
                    });
                }
            }, 80);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nothing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            transition: background-color 0.5s ease;
            
            /* PREVENT ALL HIGHLIGHTING & ZOOMING */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .content-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw + 1rem, 5rem);
            font-weight: 300;
            max-width: 90%;
            line-height: 1.4;
            letter-spacing: 0.02em;
        }

        .word {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        color 0.2s, 
                        background-color 0.2s;
            padding: 0 0.1em;
            border-radius: 6px;
            -webkit-tap-highlight-color: transparent; 
        }

        .word:hover { color: #fff; }

        .word.selected {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .word.swapping { animation: swapBounce 0.3s ease; }

        @keyframes swapBounce {
            0% { transform: scale(1.15); }
            50% { transform: scale(0.85); }
            100% { transform: scale(1); }
        }

        .hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #555;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease forwards 1s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* DEVICE DETECTION */
        @media (max-width: 600px) {
            body { background-color: #1a101c; }
            h1 { font-weight: 400; }
            .hint { font-size: 0.75rem; }
        }

        @media (min-width: 1600px) {
            body { background-color: #0a0f14; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h1 id="sentence"></h1>
        <div class="hint">Tap a word. Then tap another.</div>
    </div>

    <script>
        // --- WEB AUDIO API SETUP ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSelectSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSwapSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playTypeSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200 + Math.random() * 600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        // --- GAME LOGIC ---
        const originalSentence = "There is nothing to do here. Go do something else.";
        const targetSentence = "There is something to do here. Go do nothing else."; 
        const sentenceEl = document.getElementById('sentence');
        let selectedWord = null;
        let triggered = false;

        function createWords(text, container) {
            const words = text.split(' ');
            words.forEach(word => {
                const span = document.createElement('span');
                span.className = 'word';
                span.textContent = word;
                // Make the angry text pure white as requested previously
                if (container === sentenceEl && triggered) {
                    span.style.color = '#ffffff'; 
                }
                container.appendChild(span);
                container.appendChild(document.createTextNode(' ')); 
            });
        }

        // 1. Build the initial sentence
        createWords(originalSentence, sentenceEl);

        function checkSentence() {
            // Only check the original words (the first 10 words) to avoid checking the angry response
            const originalWords = document.querySelectorAll('#sentence .word');
            let currentSentence = '';
            
            // We only want to check the first 10 words (the original sentence)
            for (let i = 0; i < 10; i++) {
                currentSentence += originalWords[i].textContent;
                if (i < 9) currentSentence += ' ';
            }

            if (currentSentence === targetSentence && !triggered) {
                triggered = true;
                setTimeout(triggerAnger, 400);
            }
        }

        // 2. Global Click Handler
        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('word')) return;
            
            e.preventDefault();
            const wordEl = e.target;

            if (!selectedWord) {
                selectedWord = wordEl;
                wordEl.classList.add('selected');
                playSelectSound();
            } 
            else if (selectedWord === wordEl) {
                wordEl.classList.remove('selected');
                selectedWord = null;
            } 
            else {
                const word1 = selectedWord.textContent;
                const word2 = wordEl.textContent;

                selectedWord.textContent = word2;
                wordEl.textContent = word1;

                wordEl.classList.add('swapping');
                selectedWord.classList.add('swapping');
                playSwapSound();
                
                checkSentence();

                setTimeout(() => {
                    wordEl.classList.remove('swapping');
                    selectedWord.classList.remove('swapping');
                    selectedWord.classList.remove('selected');
                    selectedWord = null;
                }, 300);
            }
        });

        // 3. The Trap Trigger (Now inline!)
        function triggerAnger() {
            // Add a line break so the response starts on a new line
            const br = document.createElement('br');
            sentenceEl.appendChild(br);

            // Create a temporary span just for the typing effect
            const tempSpan = document.createElement('span');
            tempSpan.style.color = '#ffffff';
            sentenceEl.appendChild(tempSpan);

            const angryText = "You think you are funny? Well I'm a smart person. And I think you are an idiot for even trying. Give up.";
            let index = 0;
            
            const interval = setInterval(() => {
                if (index < angryText.length) {
                    tempSpan.textContent += angryText[index];
                    playTypeSound();
                    index++;
                } else {
                    clearInterval(interval);
                    
                    // Remove the temporary typed text
                    tempSpan.remove();
                    
                    // Add the final clickable words directly into the main sentence!
                    createWords(angryText, sentenceEl);
                }
            }, 40);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nothing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            transition: background-color 0.5s ease;
            
            /* PREVENT ALL HIGHLIGHTING & ZOOMING */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .content-wrapper {
            max-height: 100dvh;
            width: 100%;
            max-width: 900px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .content-wrapper::-webkit-scrollbar { display: none; }

        h1 {
            font-size: clamp(1.5rem, 4vw + 1rem, 5rem);
            font-weight: 300;
            max-width: 90%;
            line-height: 1.4;
            letter-spacing: 0.02em;
        }

        .word {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        color 0.2s, 
                        background-color 0.2s;
            padding: 0 0.1em;
            border-radius: 6px;
            -webkit-tap-highlight-color: transparent; 
        }

        .word:hover { color: #fff; }

        .word.selected {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .word.swapping { animation: swapBounce 0.3s ease; }

        @keyframes swapBounce {
            0% { transform: scale(1.15); }
            50% { transform: scale(0.85); }
            100% { transform: scale(1); }
        }

        .hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #555;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease forwards 1s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .angry-message {
            margin-top: 40px;
            font-size: clamp(1.5rem, 4vw + 1rem, 5rem); 
            color: #ffffff; 
            max-width: 90%;
            text-align: left;
            font-weight: 300; 
            line-height: 1.4;
            
            max-height: 40vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;
        }
        .angry-message::-webkit-scrollbar { width: 6px; }
        .angry-message::-webkit-scrollbar-track { background: transparent; }
        .angry-message::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        @media (max-width: 600px) {
            body { background-color: #1a101c; }
            h1 { font-weight: 400; }
            .hint { font-size: 0.75rem; }
        }

        @media (min-width: 1600px) {
            body { background-color: #0a0f14; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h1 id="sentence"></h1>
        <div class="hint">Tap a word. Then tap another.</div>
        <div id="angryBox" class="angry-message" style="display: none;"></div>
    </div>

    <script>
        // --- WEB AUDIO API SETUP ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSelectSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSwapSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playTypeSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200 + Math.random() * 600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        // --- GAME LOGIC ---
        const originalSentence = "There is nothing to do here. Go do something else.";
        const targetSentence = "There is something to do here. Go do nothing else."; // THE SECRET PHRASE
        const sentenceEl = document.getElementById('sentence');
        const angryBox = document.getElementById('angryBox');
        let selectedWord = null;
        let triggered = false;

        function createWords(text, container) {
            const words = text.split(' ');
            words.forEach(word => {
                const span = document.createElement('span');
                span.className = 'word';
                span.textContent = word;
                container.appendChild(span);
                container.appendChild(document.createTextNode(' ')); 
            });
        }

        // 1. Build the initial sentence
        createWords(originalSentence, sentenceEl);

        // NEW: Function to check if the entire sentence matches the target
        function checkSentence() {
            const words = document.querySelectorAll('#sentence .word');
            let currentSentence = '';
            
            words.forEach((word, index) => {
                currentSentence += word.textContent;
                if (index < words.length - 1) {
                    currentSentence += ' ';
                }
            });

            // If it matches exactly, trigger the anger!
            if (currentSentence === targetSentence && !triggered) {
                triggered = true;
                setTimeout(triggerAnger, 400);
            }
        }

        // 2. Global Click Handler
        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('word')) return;
            
            e.preventDefault();
            const wordEl = e.target;

            if (!selectedWord) {
                selectedWord = wordEl;
                wordEl.classList.add('selected');
                playSelectSound();
            } 
            else if (selectedWord === wordEl) {
                wordEl.classList.remove('selected');
                selectedWord = null;
            } 
            else {
                const word1 = selectedWord.textContent;
                const word2 = wordEl.textContent;

                // Swap text
                selectedWord.textContent = word2;
                wordEl.textContent = word1;

                // Animations & Sound
                wordEl.classList.add('swapping');
                selectedWord.classList.add('swapping');
                playSwapSound();
                
                // CHECK THE ENTIRE SENTENCE AFTER EVERY SWAP
                checkSentence();

                setTimeout(() => {
                    wordEl.classList.remove('swapping');
                    selectedWord.classList.remove('swapping');
                    selectedWord.classList.remove('selected');
                    selectedWord = null;
                }, 300);
            }
        });

        // 3. The Trap Trigger
        function triggerAnger() {
            angryBox.style.display = 'block';
            angryBox.textContent = '';
            
            const angryText = "You think you are funny? Well I'm a smart person. And I think you are an idiot for even trying. Give up.";
            let index = 0;
            
            const interval = setInterval(() => {
                if (index < angryText.length) {
                    angryBox.textContent += angryText[index];
                    playTypeSound();
                    index++;
                    angryBox.scrollTop = angryBox.scrollHeight;
                } else {
                    clearInterval(interval);
                    // Convert the angry text into clickable words
                    const currentText = angryBox.textContent;
                    angryBox.textContent = '';
                    createWords(currentText, angryBox);
                }
            }, 40);
        }
    </script>
</body>
</html>
